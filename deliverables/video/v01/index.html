<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCE视频录制材料 v01</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f6;color:#203447;font:16px/1.7 system-ui,"PingFang SC",sans-serif}main{max-width:1640px;margin:auto;padding:24px}h1{margin:0;font-size:26px}p{margin:8px 0 16px}nav{display:flex;flex-wrap:wrap;gap:18px;margin:18px 0}a{color:#245d7d;text-underline-offset:4px}.controls{display:flex;gap:12px;align-items:center;margin:16px 0}button{background:white;border:1px solid #cbd6de;padding:8px 13px;border-radius:3px;color:#203447;cursor:pointer;font:inherit}.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}#stage{background:white;line-height:0;border:1px solid #d5dfe5}#stage img{width:100%;height:auto;display:block}aside{background:white;padding:22px;border-top:3px solid #245d7d}aside h2{font-size:20px;margin:0 0 8px}#speech{white-space:pre-line;font-size:18px;line-height:1.9}.muted{color:#697782}.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:24px}.list button{text-align:left}#stage:fullscreen{border:0;display:flex;align-items:center;justify-content:center;background:#000;width:100vw;height:100vh}#stage:fullscreen img{max-width:100vw;max-height:100vh;object-fit:contain}#counter{min-width:90px;text-align:center}@media(max-width:1000px){.layout{grid-template-columns:1fr}.list{grid-template-columns:1fr}main{padding:12px}}@media print{nav,.controls,.list{display:none}.layout{display:block}aside{margin-top:16px}}
</style><main><h1>SCE视频录制材料 v01</h1><p class="muted">8页，计划4分45秒。沿用当前v10内容和方法图风格。此处是PPT与台词预览，尚未录制MP4。</p><nav><a href="SCE_video_presentation_v01.pptx">下载可编辑PPT</a><a href="narration.md">逐页口播稿</a><a href="recording_guide.md">详细录屏操作单</a><a href="record_demo.command">离线演示命令</a><a href="README.md">文件导航</a></nav><div class="controls"><button onclick="show(current-1)">上一页</button><span id="counter"></span><button onclick="show(current+1)">下一页</button><button onclick="document.getElementById('stage').requestFullscreen()">全屏预演</button><span class="muted">左右方向键翻页，Esc退出全屏</span></div><div class="layout"><div id="stage"><img id="slide" alt="当前视频PPT页面"></div><aside><h2 id="title"></h2><p id="timing" class="muted"></p><p id="speech"></p></aside></div><div class="list"><button type="button" onclick="show(0)">01　居民通胀预期的生成式社会模拟</button><button type="button" onclick="show(1)">02　家庭背景与可见信息共同进入答卷</button><button type="button" onclick="show(2)">03　研究包中的执行与结果追溯</button><button type="button" onclick="show(3)">04　历史重建缓解了部分高通胀期低估</button><button type="button" onclick="show(4)">05　近期组合降低全国中心误差</button><button type="button" onclick="show(5)">06　周度更新提供了月内变化线索</button><button type="button" onclick="show(6)">07　循环信贷预测出现局部增量</button><button type="button" onclick="show(7)">08　可追溯的模拟框架与明确的改进方向</button></div><p class="muted">第3页为操作段的讲解画面，最终视频中插入约40秒真实录屏；不要把两者时长重复相加。原论文、研究包和方法图未改。</p></main><script>const story={"status": "first_recording_draft", "target_seconds": 285, "slides": [{"slide": 1, "title": "居民通胀预期的生成式社会模拟", "seconds": 30, "start_seconds": 0, "end_seconds": 30, "purpose": "真实问卷与研究对象", "visual": "左侧研究问题，右侧真实匿名十档答卷。Q8点预期与Q9概率分配并列解释。", "narration": "大家好，我们用生成式智能体，模拟美国家庭怎样判断未来一年的物价。研究对象是纽约联储的消费者预期调查。受访者既给出一个预测数值，也把概率分给十个通胀区间。右边是一份真实匿名答卷。我们同时观察全国水平、家庭差异和跨期变化。"}, {"slide": 2, "title": "家庭背景与可见信息共同进入答卷", "seconds": 55, "start_seconds": 30, "end_seconds": 85, "purpose": "解释机制与设计依据", "visual": "原方法图简化为可编辑流程。人口、历史、差异化信息进入问卷模型，再计分与汇总。底部交代经验依据。", "narration": "一个家庭的判断，从已有信念和生活环境出发。我们根据历史数据筛选出四个人口维度，划成五十四类。小群体适当多抽，汇总时恢复真实比例。有历史记录的沿用过去答卷，没有记录的参考近期相似家庭。不同家庭收到的新闻数量和主题不同，食品价格也按采购角色组织，所有信息都限制在作答之前。这对应信念持续性、有限注意和价格体验。经过小样本对照，我们选择新闻路由和时间机制。模型填写原问卷，概率答卷先转为个人密度均值，再按人口权重求全国中位数。"}, {"slide": 3, "title": "研究包中的执行与结果追溯", "seconds": 40, "start_seconds": 85, "end_seconds": 125, "purpose": "实际操作镜头", "visual": "本页为录屏前后过渡。最终剪辑中插入README、终端、结果页面与历史运行记录。", "narration": "这里展示实际研究包。读取人口、环境和模拟配置后，通过统一入口执行。现在运行的是二十户工程示例，以及封存研究数据的离线复算，不会再次调用模型。完成后查看新生成的结果和收据。正式模型答卷已在此前生成，配置、费用和技术补跑都有记录。"}, {"slide": 4, "title": "历史重建缓解了部分高通胀期低估", "seconds": 40, "start_seconds": 125, "end_seconds": 165, "purpose": "A82全国结果", "visual": "82个月全国曲线为主，2021放大及少量数字。真实、原始模拟、已公开历史值区分线型。", "narration": "历史重建覆盖二〇一九年一月至二〇二五年十月，共八十二个月。全国中位数的平均误差是零点二九八个百分点。信息机制调整后，二〇二一年的低估有所减轻，但仍落后于沿用已公布调查值的基线。模型能跟随总体变化，对异常上行却反应不足。把模拟与历史值组合，按早四十八个月确定权重，后面三十四个月的误差为零点一八四，基线为零点一九四。"}, {"slide": 5, "title": "近期组合降低全国中心误差", "seconds": 35, "start_seconds": 165, "end_seconds": 200, "purpose": "B11与微观诊断", "visual": "近期全国路径与四类MAE柱图。底部明确历史微观分歧诊断与统计扩展边界。", "narration": "近期十一个月没有当期微观资料，我们从当时可得的旧样本合成起点，对齐已公布的全国水平。原始模拟仍有偏差，但把约百分之十三点四的模拟与历史值组合，平均误差降到零点一四四，基线为零点一七三。历史微观检验还显示，模拟家庭的分歧明显偏窄。统计扩展补齐了人口规模，却没有增加独立判断。"}, {"slide": 6, "title": "周度更新提供了月内变化线索", "seconds": 40, "start_seconds": 200, "end_seconds": 240, "purpose": "月度与周度拓展", "visual": "47周路径为主，标出发布校准与9月漏判。左侧解释月度链漂移和发布后重置。", "narration": "同一批家庭一直继承模拟回答，月度实验的后期出现高估。我们又探索每周更新：新的历史调查结果公布后校准起点，其他周继续传递个人信念。固定三百户、四十七周的模拟，在十一个月末的平均误差为零点一五二，基线为零点一七三。这里没有在输出端做线性组合。它在五个月改善，九月仍漏判上行，说明周度更新能提供月内线索，也存在明确的失败月份。"}, {"slide": 7, "title": "循环信贷预测出现局部增量", "seconds": 25, "start_seconds": 240, "end_seconds": 265, "purpose": "下游用途", "visual": "未来1/2/3个月RMSE改善折线，突出2个月8.17%。底部说明相对同结构官方SCE回归及简单基线。", "narration": "我们还检验了模拟指标的经济用途。在相同回归结构下，用月度模拟替代官方调查指标，循环信贷未来两个月的预测误差降低约百分之八点二。其他结局没有一致改善，信贷的历史均值基线也仍然很强。这是一个值得继续研究的用途线索。"}, {"slide": 8, "title": "可追溯的模拟框架与明确的改进方向", "seconds": 20, "start_seconds": 265, "end_seconds": 285, "purpose": "结论与边界", "visual": "一条研究主线与两项正向线索，末尾短列局限和study入口。", "narration": "我们将家庭、信息与历史信念接入真实问卷，逐层检验模拟表现。近期组合、周度与信贷显示局部价值，也留下明确的改进方向。代码和复算入口随研究包提供。谢谢。"}]};let current=0;function show(i){current=Math.max(0,Math.min(story.slides.length-1,i));const s=story.slides[current];document.getElementById('slide').src='slides/slide_'+String(s.slide).padStart(2,'0')+'.png';document.getElementById('title').textContent=s.slide+'. '+s.title;document.getElementById('speech').textContent=s.narration;const f=x=>String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0');document.getElementById('timing').textContent=f(s.start_seconds)+'—'+f(s.end_seconds)+'，约'+s.seconds+'秒';document.getElementById('counter').textContent=(current+1)+' / '+story.slides.length;}document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1);});show(0);</script></html>
